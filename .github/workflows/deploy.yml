name: Deploy CareerFit AI v2

on:
  push:
    branches:
      - main

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: careerfit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d careerfit_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Create backend test env
        run: |
          cat > .env.test << EOF
          NODE_ENV=test
          PORT=4000
          DATABASE_URL="postgresql://postgres:postgres@localhost:5432/careerfit_test?schema=public"
          JWT_SECRET=test-jwt-secret
          JWT_EXPIRES_IN=15m
          REFRESH_TOKEN_EXPIRES_IN_DAYS=7
          EMAIL_VERIFICATION_EXPIRES_MINUTES=30
          PASSWORD_RESET_EXPIRES_MINUTES=30
          CLIENT_URL=http://localhost:3000
          API_URL=http://localhost:4000
          RESEND_API_KEY=test-resend-key
          EMAIL_FROM=test@example.com
          GEMINI_API_KEY=test-gemini-key
          EOF

      - name: Generate Prisma client
        run: npm run generate

      - name: Run test database migrations
        run: npm run test:migrate

      - name: Run backend tests
        run: npm test

      - name: Build backend
        run: npm run build

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Create frontend production env
        run: |
          cat > .env.production << EOF
          NEXT_PUBLIC_API_URL=https://career-fit-ai.com/api/v2
          EOF

      - name: Build frontend
        run: npm run build

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs:
      - backend-ci
      - frontend-ci

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/career-fit-ai-v2
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
