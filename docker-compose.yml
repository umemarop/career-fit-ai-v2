services:
  backend:
    build:
      context: ./backend

    ports:
      - "4000:4000"
      - "51212:51212"

    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

    env_file:
      - ./backend/.env.docker

    depends_on:
      - postgres

  postgres:
    image: postgres:16

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: careerfit_dev

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  backend_node_modules:
